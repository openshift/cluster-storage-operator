resources:
  - ../../base
namespace: openshift-cluster-csi-drivers
patches:
  # The deployment runs in the management cluster, not here in the guest
  # cluster. Remove it.
  - patch: |
      $patch: delete
      kind: Kustomization
      metadata:
        name: PLACEHOLDER
    target:
      annotationSelector: "storage.openshift.io/remove-from=guest"
  # The CVO supplies guest Roles through manifests/.
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
    patch: |
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: PLACEHOLDER
  # The CVO supplies guest ClusterRoles through manifests/.
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
    patch: |
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: PLACEHOLDER
