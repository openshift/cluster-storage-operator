resources:
  - ../base
namespace: openshift-cluster-csi-drivers
patches:
  - path: deployment.patch.yaml
    target:
      kind: Deployment
      version: v1
  # The CVO manages this ClusterRole through manifests/ on standalone clusters.
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: gcp-pd-csi-driver-operator-clusterrole
    patch: |
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: gcp-pd-csi-driver-operator-clusterrole
  # The CVO manages this Role through manifests/ on standalone clusters.
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
      name: gcp-pd-csi-driver-operator-role
    patch: |
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: gcp-pd-csi-driver-operator-role
