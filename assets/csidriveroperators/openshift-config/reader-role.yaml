# Shared Role for CSI driver operators to read Secrets and ConfigMaps from openshift-config namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: csi-driver-operator-config-reader
  namespace: openshift-config
rules:
  - apiGroups:
    - ''
    resources:
    - secrets
    - configmaps
    verbs:
    - get
    - list
    - watch
