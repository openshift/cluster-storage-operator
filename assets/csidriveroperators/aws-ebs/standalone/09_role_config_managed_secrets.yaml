# Allow AWS EBS CSI driver operator to read Secrets from openshift-config-managed namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-ebs-csi-driver-operator-secrets-reader-role
  namespace: openshift-config-managed
rules:
  - apiGroups:
    - ''
    resources:
    - secrets
    verbs:
    - get
    - list
    - watch
