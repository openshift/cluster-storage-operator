apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ibm-vpc-block-csi-driver-operator-clusterrole
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resourceNames:
  - openshift-csi-main-attacher-role
  - openshift-csi-main-provisioner-role
  - openshift-csi-main-resizer-role
  - openshift-csi-main-snapshotter-role
  - openshift-csi-provisioner-configmap-and-secret-reader-role
  - openshift-csi-provisioner-volumesnapshot-reader-role
  resources:
  - clusterroles
  verbs:
  - bind
