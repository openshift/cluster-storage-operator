resources:
  - ../../base
namespace: openshift-cluster-csi-drivers
patches:
  - patch: |
      $patch: delete
      kind: Kustomization
      metadata:
        name: PLACEHOLDER
    target:
      annotationSelector: "storage.openshift.io/remove-from=guest"
  # remove these annotations as they're just noise post-kustomization
  # note that '~1' is the escaped form of '/'
  # https://datatracker.ietf.org/doc/html/rfc6901
  - target:
      annotationSelector: "storage.openshift.io/remove-from=mgmt"
    patch: |
      - op: "remove"
        path: "/metadata/annotations/storage.openshift.io~1remove-from"
  # The CVO supplies guest Roles through manifests/.
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
    patch: |
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: PLACEHOLDER
  # The CVO supplies guest ClusterRoles through manifests/.
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
    patch: |
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: PLACEHOLDER
