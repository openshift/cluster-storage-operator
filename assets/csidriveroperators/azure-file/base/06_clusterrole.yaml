apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: azure-file-csi-driver-operator-clusterrole
  annotations:
    storage.openshift.io/remove-from: mgmt
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resourceNames:
  - openshift-csi-main-attacher-role
  - openshift-csi-main-provisioner-role
  - openshift-csi-main-resizer-role
  - openshift-csi-main-snapshotter-role
  - openshift-csi-provisioner-volumesnapshot-reader-role
  - openshift-csi-resizer-storageclass-reader-role
  resources:
  - clusterroles
  verbs:
  - bind
- apiGroups:
  - storage.openshift.io
  resources:
  - azurefilecsidrivers/status
  verbs:
  - patch
  - update
