apiVersion: v1
kind: Service
metadata:
  name: volume-device-exporter
  namespace: openshift-cluster-storage-operator
  labels:
    app: csi-volume-device-exporter
  annotations:
    service.alpha.openshift.io/serving-cert-secret-name: volume-device-exporter-serving-cert
spec:
  clusterIP: None
  selector:
    app: volume-device-exporter
  ports:
  - name: https-metrics
    port: 443
    targetPort: https-metrics
