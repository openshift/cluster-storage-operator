apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: volume-device-exporter
allowPrivilegedContainer: false
allowHostDirVolumePlugin: true
allowHostPID: false
allowHostIPC: false
allowHostPorts: false
allowHostNetwork: false
readOnlyRootFilesystem: true
seccompProfiles:
- runtime/default
runAsUser:
  type: MustRunAs
  uid: 0
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
volumes:
- configMap
- hostPath
- secret
users:
- system:serviceaccount:openshift-cluster-storage-operator:volume-device-exporter
