apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: csi-volume-path-health
  namespace: openshift-cluster-storage-operator
  labels:
    role: alert-rules
spec:
  groups:
  - name: csi-volume-path-health
    rules:
    # Keep dependencies in this group before their consumers.
    # Map PV names to CSI driver names and volume handles using
    # kube_persistentvolume_info series with nonempty CSI driver and volume handle
    # labels. Drop other labels and rename the CSI labels to match the volume
    # device exporter. Produce one series per
    # (persistentvolume, driver, volume_handle) tuple.
    - record: csiaddons:volume_pv_info
      expr: |
        max by(persistentvolume, driver, volume_handle) (
          label_replace(
            label_replace(
              max by(persistentvolume, csi_driver, csi_volume_handle) (
                kube_persistentvolume_info{csi_driver!="", csi_volume_handle!=""}
              ),
              "volume_handle", "$1", "csi_volume_handle", "(.+)"
            ),
            "driver", "$1", "csi_driver", "(.+)"
          )
        )
    # Map each PV to at most one PVC reported as Bound, retaining the PVC name
    # and namespace. Deduplicate source series before selecting a PVC per PV.
    # If candidates tie, a different PVC may be selected for the same PV at each
    # evaluation. The selection guarantees at most one series per PV, keeping
    # downstream joins unambiguous; it does not identify an authoritative PVC.
    # PVs without a matching bound PVC are omitted.
    # This recording is not restricted to CSI PVs.
    - record: csiaddons:pv_bound_claim_info
      expr: |
        topk by(persistentvolume) (
          1,
          max by(persistentvolume, persistentvolumeclaim, namespace) (
            label_replace(
              kube_persistentvolumeclaim_info{volumename!=""}
              * on(namespace, persistentvolumeclaim) group_left()
              max by(namespace, persistentvolumeclaim) (
                kube_persistentvolumeclaim_status_phase{phase="Bound"} == 1
              ),
              "persistentvolume", "$1", "volumename", "(.+)"
            )
          )
        )
    # Add the bound PVC name and namespace to each CSI PV when a matching
    # bound claim is available. Otherwise, retain the PV without those labels.
    - record: csiaddons:volume_pv_context_info
      expr: |
        (
          csiaddons:volume_pv_info
          * on(persistentvolume) group_left(persistentvolumeclaim, namespace)
          csiaddons:pv_bound_claim_info
        )
        or on(persistentvolume)
        csiaddons:volume_pv_info

    # Enrich each reported node/device mapping with a PV context: the PV name
    # plus the bound PVC name and namespace when available.
    # Preserve separate mappings for volumes reported on multiple nodes or devices.
    # Select at most one PV context per (driver, volume_handle), because the
    # group_left join requires a unique context for each matching pair.
    # If contexts tie, a different context may be selected at each evaluation.
    # This changes only the attached PV/PVC labels, not which node/device mappings
    # match or which devices their health metrics describe.
    # Mappings without a matching PV context are omitted.
    - record: csiaddons:volume_node_device_context_info
      expr: |
        max by(driver, volume_handle, node, device) (
          csiaddons_volume_node_device_info
        )
        * on(driver, volume_handle) group_left(persistentvolume, persistentvolumeclaim, namespace)
        topk by(driver, volume_handle) (
          1,
          csiaddons:volume_pv_context_info
        )

    # Copy the kernel device name (normally dm-N) to sysfs_name, then replace
    # device with the multipath device name from node_dmmultipath_device_info.
    # Match by (sysfs_name, node), since device names are local to each node.
    # Copy instance to node on the multipath metric; their values must identify
    # nodes in the same way as the volume device exporter.
    # Select one multipath-info series per (sysfs_name, node) to keep the join
    # unambiguous. Tied candidates have no guaranteed winner; conflicting device
    # labels can change which device health metrics match.
    # Mappings without matching multipath information are omitted.
    - record: csiaddons:volume_multipath_device_info
      expr: |
        label_replace(
          csiaddons:volume_node_device_context_info,
          "sysfs_name", "$1", "device", "(.*)"
        )
        * on(sysfs_name, node) group_left(device)
        topk by(sysfs_name, node) (
          1,
          label_replace(node_dmmultipath_device_info, "node", "$1", "instance", "(.+)")
        )
    # Retain the NVMe namespace device and attach its subsystem, matching by
    # (device, node). Only volume mappings with device names matching nvme.* qualify.
    # Copy instance to node on the namespace metric; their values must identify
    # nodes in the same way as the volume device exporter.
    # Select one namespace-info series per (device, node) to keep the join
    # unambiguous. Tied candidates have no guaranteed winner; conflicting subsystem
    # labels can change which subsystem health metrics match.
    # Mappings without matching namespace information are omitted.
    - record: csiaddons:volume_nvme_subsystem_info
      expr: |
        csiaddons:volume_node_device_context_info{device=~"nvme.*"}
        * on(device, node) group_left(subsystem)
        topk by(device, node) (
          1,
          label_replace(node_nvmesubsystem_namespace_info, "node", "$1", "instance", "(.+)")
        )
    # Storage path health alerts.
    # These alerts use the recording rules above to identify the volumes associated
    # with each device or NVMe subsystem on a node. They check path counts to detect
    # degraded connectivity (some paths remain usable) or lost connectivity
    # (no paths remain usable). Missing path-count metrics do not trigger these alerts.
    - alert: CSIAddonsVolumeMultipathDegraded
      expr: |
        csiaddons:volume_multipath_device_info
        * on(device, node) group_left()
        (
          max by(device, node) (
            label_replace(node_dmmultipath_device_paths_failed, "node", "$1", "instance", "(.+)")
          ) > 0
          and on(device, node)
          max by(device, node) (
            label_replace(node_dmmultipath_device_paths_active, "node", "$1", "instance", "(.+)")
          ) > 0
        )
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: A CSI volume has degraded multipath connectivity
        description: >-
          PV {{ $labels.persistentvolume }}{{ if $labels.persistentvolumeclaim }}
          (PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }}){{ end }}
          on node {{ $labels.node }} has at least one failed path to multipath device
          {{ $labels.device }}, while at least one usable path remains.
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-storage-operator/CSIAddonsVolumeMultipathDegraded.md
    - alert: CSIAddonsVolumeMultipathLost
      expr: |
        csiaddons:volume_multipath_device_info
        * on(device, node) group_left()
        (
          max by(device, node) (
            label_replace(node_dmmultipath_device_paths_active, "node", "$1", "instance", "(.+)")
          ) == 0
        )
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: A CSI volume has lost all multipath connectivity
        description: >-
          All paths to multipath device {{ $labels.device }} for PV
          {{ $labels.persistentvolume }}{{ if $labels.persistentvolumeclaim }}
          (PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }}){{ end }}
          on node {{ $labels.node }} are down.
          Immediate investigation of storage connectivity is required.
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-storage-operator/CSIAddonsVolumeMultipathLost.md
    - alert: CSIAddonsVolumeNVMeSubsystemDegraded
      expr: |
        csiaddons:volume_nvme_subsystem_info
        * on(subsystem, node) group_left()
        (
          (
            max by(subsystem, node) (
              label_replace(node_nvmesubsystem_paths, "node", "$1", "instance", "(.+)")
            )
            - max by(subsystem, node) (
              label_replace(node_nvmesubsystem_paths_live, "node", "$1", "instance", "(.+)")
            )
          ) > 0
          and on(subsystem, node)
          max by(subsystem, node) (
            label_replace(node_nvmesubsystem_paths_live, "node", "$1", "instance", "(.+)")
          ) > 0
        )
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: A CSI volume has degraded NVMe-oF connectivity
        description: >-
          PV {{ $labels.persistentvolume }}{{ if $labels.persistentvolumeclaim }}
          (PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }}){{ end }}
          on node {{ $labels.node }} has at least one non-live path to NVMe-oF subsystem
          {{ $labels.subsystem }}, while at least one usable path remains.
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-storage-operator/CSIAddonsVolumeNVMeSubsystemDegraded.md
    - alert: CSIAddonsVolumeNVMeSubsystemLost
      expr: |
        csiaddons:volume_nvme_subsystem_info
        * on(subsystem, node) group_left()
        (
          max by(subsystem, node) (
            label_replace(node_nvmesubsystem_paths_live, "node", "$1", "instance", "(.+)")
          ) == 0
        )
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: A CSI volume has lost all NVMe-oF connectivity
        description: >-
          All paths to NVMe-oF subsystem {{ $labels.subsystem }} for PV
          {{ $labels.persistentvolume }}{{ if $labels.persistentvolumeclaim }}
          (PVC {{ $labels.persistentvolumeclaim }} in namespace {{ $labels.namespace }}){{ end }}
          on node {{ $labels.node }} are non-live.
          Immediate investigation of storage connectivity is required.
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-storage-operator/CSIAddonsVolumeNVMeSubsystemLost.md
    # Alert when Prometheus has no monitoring data for any volume device exporter
    # target for five minutes (no matching up series).
    # Targets reporting up=0 are handled by the target-down alert below.
    - alert: CSIAddonsVolumeDeviceExporterDown
      expr: absent(up{job="csi-volume-device-exporter"}) == 1
      for: 5m
      labels:
        severity: warning
        operator_health_impact: warning
      annotations:
        summary: CSI volume device exporter is not running
        description: No CSI volume device exporter target has been scraped for five minutes.
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-storage-operator/CSIAddonsVolumeDeviceExporterDown.md
    # Alert when Prometheus scrapes of a volume device exporter target keep
    # failing for ten minutes (up=0). A target that disappears from discovery
    # does not trigger this alert.
    - alert: CSIAddonsVolumeDeviceExporterNodeDown
      expr: up{job="csi-volume-device-exporter"} == 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: A CSI volume device exporter target is down
        description: The CSI volume device exporter target {{ $labels.instance }} has been unreachable for ten minutes.
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-storage-operator/CSIAddonsVolumeDeviceExporterDown.md
