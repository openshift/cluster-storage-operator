kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cluster-storage-operator-config-role
  annotations:
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    capability.openshift.io/name: Storage
rules:
  # Cluster infrastructure observation (read-only)
  - apiGroups: ["config.openshift.io"]
    resources: ["infrastructures"]
    verbs: ["get", "list", "watch"]

  # Proxy configuration observation (read-only)
  - apiGroups: ["config.openshift.io"]
    resources: ["proxies"]
    verbs: ["get", "list", "watch"]

  # API server configuration observation (read-only)
  - apiGroups: ["config.openshift.io"]
    resources: ["apiservers"]
    verbs: ["get", "list", "watch"]

  # Cluster version observation (read-only)
  - apiGroups: ["config.openshift.io"]
    resources: ["clusterversions"]
    verbs: ["get", "list", "watch"]

  # Feature gates observation (read-only)
  - apiGroups: ["config.openshift.io"]
    resources: ["featuregates"]
    verbs: ["get", "list", "watch"]

  # Custom Resource Definitions management
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Prometheus monitoring configuration
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
