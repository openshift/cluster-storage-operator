# Replacement binding to the fine-grained cluster-storage-operator-storage-role.
# The old cluster-admin binding is removed separately so this file stays a single
# document and its HyperShift profile variant (08_operator_rbac-hypershift.yaml)
# is generated correctly:
#   - standalone / CVO-managed: 08_0002_operator_rbac-delete.yaml
#   - HyperShift:               08_0002_operator_rbac-hypershift-delete.yaml
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cluster-storage-operator-role
  labels:
    kubernetes.io/cluster-service: "true"
    addonmanager.kubernetes.io/mode: Reconcile
  annotations:
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    capability.openshift.io/name: Storage
subjects:
  - kind: ServiceAccount
    name: cluster-storage-operator
    namespace: openshift-cluster-storage-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-storage-operator-storage-role
