# Deletion manifest for the old cluster-admin binding on standalone / CVO-managed
# profiles — marked for deletion to avoid the immutable roleRef conflict when
# migrating cluster-storage-operator-role to cluster-storage-operator-storage-role.
# HyperShift's equivalent is 08_0002_operator_rbac-hypershift-delete.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-storage-operator-role
  annotations:
    release.openshift.io/delete: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    capability.openshift.io/name: Storage
subjects:
  - kind: ServiceAccount
    name: cluster-storage-operator
    namespace: openshift-cluster-storage-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
