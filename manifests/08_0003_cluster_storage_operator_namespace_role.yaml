kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cluster-storage-operator-namespace-role
  namespace: openshift-cluster-csi-drivers
  annotations:
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    capability.openshift.io/name: Storage
rules:
  # CSO-specific: namespace-scoped RBAC management (roles and rolebindings in this namespace)
  - apiGroups:
    - rbac.authorization.k8s.io
    resources:
    - rolebindings
    - roles
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  # CSO-specific: pod disruption budgets for CSI operators in this namespace
  - apiGroups:
    - policy
    resources:
    - poddisruptionbudgets
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
