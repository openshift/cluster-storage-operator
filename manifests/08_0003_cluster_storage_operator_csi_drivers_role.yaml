apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-storage-operator
  namespace: openshift-cluster-csi-drivers
  annotations:
    include.release.openshift.io/ibm-cloud-managed: 'true'
    include.release.openshift.io/self-managed-high-availability: 'true'
    include.release.openshift.io/single-node-developer: 'true'
    capability.openshift.io/name: Storage
rules:
  - apiGroups:
      - ''
    resources:
      - configmaps
      - secrets
    verbs:
      - list
      - watch
  - apiGroups:
      - ''
    resources:
      - serviceaccounts
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
  - apiGroups:
      - ''
    resources:
      - configmaps
    verbs:
      - get
      - create
      - update
  - apiGroups:
      - ''
    resources:
      - configmaps
    verbs:
      - delete
    resourceNames:
      - cloud-provider-config
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - servicemonitors
      - prometheusrules
    verbs:
      - get
      - create
      - update
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - list
      - watch
      - create
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - get
      - update
    resourceNames:
      - aws-ebs-csi-driver-operator-rolebinding
      - azure-disk-csi-driver-operator-rolebinding
      - azure-file-csi-driver-operator-rolebinding
      - gcp-pd-csi-driver-operator-rolebinding
      - ibm-vpc-block-csi-driver-operator-rolebinding
      - manila-csi-driver-operator-rolebinding
      - openstack-cinder-csi-driver-operator-rolebinding
      - powervs-block-csi-driver-operator-rolebinding
      - vmware-vsphere-csi-driver-operator-prometheus
      - vmware-vsphere-csi-driver-operator-rolebinding
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
    verbs:
      - bind
    resourceNames:
      - aws-ebs-csi-driver-operator-role
      - azure-disk-csi-driver-operator-role
      - azure-file-csi-driver-operator-role
      - gcp-pd-csi-driver-operator-role
      - ibm-vpc-block-csi-driver-operator-role
      - manila-csi-driver-operator-role
      - openstack-cinder-csi-driver-operator-role
      - powervs-block-csi-driver-operator-role
      - vmware-vsphere-csi-driver-operator-prometheus
      - vmware-vsphere-csi-driver-operator-role
