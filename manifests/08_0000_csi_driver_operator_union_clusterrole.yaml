kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-driver-operator-union-role
  annotations:
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    capability.openshift.io/name: Storage
rules:
  # From common/clusterrole.yaml
  - apiGroups:
    - apiextensions.k8s.io
    resources:
    - customresourcedefinitions
    verbs:
    - get
  - apiGroups:
    - authentication.k8s.io
    resources:
    - tokenreviews
    verbs:
    - create
  - apiGroups:
    - config.openshift.io
    resources:
    - apiservers
    - clusterversions
    - featuregates
    - infrastructures
    - proxies
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - operator.openshift.io
    resources:
    - clustercsidrivers
    - clustercsidrivers/status
    verbs:
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - rbac.authorization.k8s.io
    resources:
    - clusterrolebindings
    - clusterroles
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - security.openshift.io
    resourceNames:
    - privileged
    resources:
    - securitycontextconstraints
    verbs:
    - use
  - apiGroups:
    - snapshot.storage.k8s.io
    resources:
    - volumesnapshotclasses
    verbs:
    - create
    - delete
    - get
    - list
    - update
    - watch
  - apiGroups:
    - storage.k8s.io
    resources:
    - csidrivers
    - storageclasses
    verbs:
    - create
    - delete
    - get
    - list
    - update
    - watch
  - apiGroups:
    - ""
    resources:
    - nodes
    verbs:
    - get
    - list
    - watch
  # Full access to clustercsidrivers (CSO creates these)
  - apiGroups:
    - operator.openshift.io
    resources:
    - clustercsidrivers
    - clustercsidrivers/status
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  # Read/update/patch on storage.k8s.io resources and status subresources
  - apiGroups:
    - storage.k8s.io
    resources:
    - volumeattachments
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - storage.k8s.io
    resources:
    - volumeattachments/status
    verbs:
    - patch
    - update
  - apiGroups:
    - storage.k8s.io
    resources:
    - csinodes
    verbs:
    - create
    - delete
    - get
    - list
    - update
    - watch
  # From driver common role and deltas: core API, apps, coordination, discovery
  - apiGroups:
    - ""
    resources:
    - configmaps
    - endpoints
    - events
    - namespaces
    - persistentvolumeclaims
    - persistentvolumes
    - pods
    - secrets
    - serviceaccounts
    - services
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - ""
    resources:
    - persistentvolumeclaims/status
    verbs:
    - patch
    - update
  - apiGroups:
    - apps
    resources:
    - daemonsets
    - deployments
    - replicasets
    - statefulsets
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - coordination.k8s.io
    resources:
    - leases
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  - apiGroups:
    - discovery.k8s.io
    resources:
    - endpointslices
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - csi.storage.k8s.io
    resources:
    - csinodeinfos
    verbs:
    - get
    - list
    - watch
  - apiGroups:
    - authorization.k8s.io
    resources:
    - subjectaccessreviews
    verbs:
    - create
  - apiGroups:
    - rbac.authorization.k8s.io
    resources:
    - roles
    - rolebindings
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  # VSphere-specific (cns.vmware.com)
  - apiGroups:
    - cns.vmware.com
    resources:
    - cnsvolumeinfoes
    - cnsvolumeoperationrequests
    - cnsvspherevolumemigrations
    - csinodetopologies
    - triggercsifullsyncs
    verbs:
    - create
    - delete
    - get
    - list
    - patch
    - update
    - watch
  # Bind on sidecar roles (for CSO and drivers)
  - apiGroups:
    - rbac.authorization.k8s.io
    resourceNames:
    - openshift-csi-main-attacher-role
    - openshift-csi-main-provisioner-role
    - openshift-csi-main-resizer-role
    - openshift-csi-main-snapshotter-role
    - openshift-csi-provisioner-configmap-and-secret-reader-role
    - openshift-csi-provisioner-volumeattributesclass-reader-role
    - openshift-csi-provisioner-volumesnapshot-reader-role
    - openshift-csi-resizer-storageclass-reader-role
    - openshift-csi-resizer-volumeattributesclass-reader-role
    resources:
    - clusterroles
    verbs:
    - bind
