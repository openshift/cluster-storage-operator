rule_files:
- replaced-by-test-script

evaluation_interval: 30s

tests:
- name: exporter absence recovers and recurrence restarts its timer
  interval: 30s
  input_series:
  # An unrelated target must not satisfy the exporter-specific selector.
  - series: 'up{job="unrelated",instance="elsewhere",namespace="other"}'
    values: '1x33'
  # A same-named job in another namespace must not satisfy the CSO-scoped selector.
  - series: 'up{job="csi-volume-device-exporter",instance="node-a",namespace="other"}'
    values: '1x33'
  - series: 'up{job="csi-volume-device-exporter",instance="node-a",namespace="openshift-cluster-storage-operator"}'
    values: 'stale stale stale stale stale stale stale stale stale stale stale stale 1 1 1 1 stale stale stale stale stale stale stale stale stale stale stale stale'
  promql_expr_test:
  - expr: 'count(ALERTS{alertname="CSIAddonsVolumeDeviceExporterDown",alertstate="pending"})'
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: 'count(ALERTS{alertname="CSIAddonsVolumeDeviceExporterDown",alertstate="firing"})'
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: 'count(ALERTS{alertname="CSIAddonsVolumeDeviceExporterDown"})'
    eval_time: 6m
    exp_samples: []
  - expr: 'count(ALERTS{alertname="CSIAddonsVolumeDeviceExporterDown",alertstate="pending"})'
    eval_time: 12m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: 'count(ALERTS{alertname="CSIAddonsVolumeDeviceExporterDown",alertstate="firing"})'
    eval_time: 13m
    exp_samples:
    - labels: '{}'
      value: 1
  alert_rule_test:
  - eval_time: 5m
    alertname: CSIAddonsVolumeDeviceExporterDown
    exp_alerts:
    - exp_labels:
        job: csi-volume-device-exporter
        namespace: openshift-cluster-storage-operator
        operator_health_impact: warning
        severity: warning
      exp_annotations:
        summary: CSI volume device exporter is not running
        description: No CSI volume device exporter target has been scraped for five minutes.
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-storage-operator/CSIAddonsVolumeDeviceExporterDown.md

- name: exporter target down fires at ten minutes and healthy target clears alerts
  interval: 30s
  input_series:
  - series: 'up{job="csi-volume-device-exporter",instance="node-a",namespace="openshift-cluster-storage-operator"}'
    values: '0x23 1x5'
  - series: 'up{job="csi-volume-device-exporter",instance="node-b",namespace="openshift-cluster-storage-operator"}'
    values: '_ _ _ _ _ _ _ _ _ _ _ _ 1x15'
  # A down target with the same job name in another namespace must be ignored.
  - series: 'up{job="csi-volume-device-exporter",instance="node-c",namespace="other"}'
    values: '0x28'
  promql_expr_test:
  - expr: 'count(ALERTS{alertname="CSIAddonsVolumeDeviceExporterDown"})'
    eval_time: 5m
    exp_samples: []
  - expr: 'count(ALERTS{alertname="CSIAddonsVolumeDeviceExporterNodeDown",alertstate="pending"})'
    eval_time: 9m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: 'count(ALERTS{alertname="CSIAddonsVolumeDeviceExporterNodeDown",alertstate="firing"})'
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: 'count(ALERTS{alertname=~"CSIAddonsVolumeDeviceExporter(Down|NodeDown)"})'
    eval_time: 12m
    exp_samples: []
  alert_rule_test:
  - eval_time: 10m
    alertname: CSIAddonsVolumeDeviceExporterNodeDown
    exp_alerts:
    - exp_labels:
        instance: node-a
        job: csi-volume-device-exporter
        namespace: openshift-cluster-storage-operator
        severity: warning
      exp_annotations:
        summary: A CSI volume device exporter target is down
        description: The CSI volume device exporter target node-a has been unreachable for ten minutes.
        runbook_url: https://github.com/openshift/runbooks/blob/master/alerts/cluster-storage-operator/CSIAddonsVolumeDeviceExporterDown.md

- name: unrelated down target does not create storage exporter alerts
  interval: 30s
  input_series:
  - series: 'up{job="unrelated",instance="elsewhere",namespace="other"}'
    values: '0x25'
  # A down target with the same job name but in another namespace is out of scope.
  - series: 'up{job="csi-volume-device-exporter",instance="node-a",namespace="other"}'
    values: '0x25'
  - series: 'up{job="csi-volume-device-exporter",instance="node-a",namespace="openshift-cluster-storage-operator"}'
    values: '1x25'
  promql_expr_test:
  - expr: 'count(ALERTS{alertname=~"CSIAddonsVolumeDeviceExporter(Down|NodeDown)"})'
    eval_time: 12m
    exp_samples: []
